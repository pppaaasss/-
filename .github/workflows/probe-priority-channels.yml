name: Probe priority TV channels

on:
  push:
    paths:
      - 'scripts/probe_priority_channels.py'
      - '.github/workflows/probe-priority-channels.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: priority-tv-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Probe high-bitrate public candidates only
        run: python3 scripts/probe_priority_channels.py
      - name: Publish probe report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priority-probe-report.txt
          if git diff --cached --quiet; then
            echo 'No probe report changes'
          else
            git commit -m 'Measure priority TV candidates before deploy'
            git pull --rebase -X theirs origin master
            git push
          fi
