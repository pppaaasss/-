name: Read-only production quality audit

on:
  push:
    branches: [master]
    paths:
      - 'scripts/production_quality_audit.py'
      - 'scripts/audit_tv_frames.py'
      - '.github/workflows/audit-production-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-quality-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record production SHA256 before audit
        run: |
          mkdir -p production-quality-audit
          sha256sum tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u | tee production-quality-audit/sha256-before.txt

      - name: Ensure ffmpeg and contact-sheet dependencies
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 -m pip install --quiet pillow

      - name: Decode and measure every tv-easy channel
        run: |
          python3 scripts/production_quality_audit.py \
            --playlist tv-easy.m3u \
            --out-dir production-quality-audit \
            --workers 14 \
            --timeout 14 \
            --speed-samples 3

      - name: Capture CCTV and mainland satellite frames
        continue-on-error: true
        run: |
          python3 scripts/audit_tv_frames.py \
            --playlist tv-easy.m3u \
            --group 卫视台 \
            --output production-quality-audit/frame-audit \
            --workers 10 \
            --timeout 30

      - name: Prove published playlists did not change
        if: always()
        run: |
          sha256sum tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u | tee production-quality-audit/sha256-after.txt
          diff -u production-quality-audit/sha256-before.txt production-quality-audit/sha256-after.txt
          test -z "$(git status --porcelain -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u)"

      - name: Upload report and frame contact sheets only as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-quality-audit-${{ github.run_id }}
          path: production-quality-audit/
          retention-days: 7
