name: Switch CCTV2 and CCTV11 verified routes once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-cctv2-cctv11-verified-once.yml'

permissions:
  contents: write

jobs:
  switch:
    if: contains(github.event.head_commit.message, '[switch-cctv2-cctv11-verified]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Replace CCTV-2 and CCTV-11 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          targets={
            'CCTV-2':'http://222.169.85.8:9901/tsfile/live/0002_1.m3u8',
            'CCTV-11':'http://63.141.230.178:82/gslb/zbdq5.m3u8?id=cctv11hd',
          }
          aliases={'CCTV2':'CCTV-2','CCTV11':'CCTV-11'}
          for fn in files:
              p=Path(fn); before=p.read_text(encoding='utf-8'); lines=before.splitlines(); counts={k:0 for k in targets}
              for i,line in enumerate(lines[:-1]):
                  if not line.startswith('#EXTINF:'): continue
                  raw=line.rsplit(',',1)[-1].strip(); key=aliases.get(raw,raw)
                  if key in targets:
                      lines[i+1]=targets[key]; counts[key]+=1
              if counts != {k:1 for k in targets}: raise SystemExit(f'{fn}: bad counts {counts}')
              p.write_text('\n'.join(lines)+('\n' if before.endswith('\n') else ''),encoding='utf-8')
          PY
      - name: Verify target-only changes
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          targets={
            'CCTV-2':'http://222.169.85.8:9901/tsfile/live/0002_1.m3u8',
            'CCTV-11':'http://63.141.230.178:82/gslb/zbdq5.m3u8?id=cctv11hd',
          }
          aliases={'CCTV2':'CCTV-2','CCTV11':'CCTV-11'}
          def masked(lines):
              out=list(lines); counts={k:0 for k in targets}
              for i,l in enumerate(out[:-1]):
                  if not l.startswith('#EXTINF:'): continue
                  raw=l.rsplit(',',1)[-1].strip(); key=aliases.get(raw,raw)
                  if key in targets:
                      out[i+1]=f'__{key}__'; counts[key]+=1
              return out,counts
          for fn in files:
              cur=Path(fn).read_text(encoding='utf-8').splitlines()
              prev=subprocess.check_output(['git','show',f'HEAD^:{fn}'],text=True).splitlines()
              cm,cc=masked(cur); pm,pc=masked(prev)
              expect={k:1 for k in targets}
              if cm!=pm or cc!=expect or pc!=expect: raise SystemExit(f'{fn}: unexpected non-target change')
              for key,url in targets.items():
                  idx=next(i for i,l in enumerate(cur[:-1]) if l.startswith('#EXTINF:') and aliases.get(l.rsplit(',',1)[-1].strip(),l.rsplit(',',1)[-1].strip())==key)
                  if cur[idx+1]!=url: raise SystemExit(f'{fn}: wrong {key}')
          print('verified CCTV-2 and CCTV-11 only')
          PY
      - name: Commit playlists
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          git diff --cached --quiet && exit 0
          git commit -m 'Switch CCTV-2 and CCTV-11 to verified 1080 routes'
          git push origin HEAD:master
