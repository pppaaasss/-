name: Probe CCTV6 fast HD

on:
  push:
    paths:
      - 'scripts/probe_cctv6_fast.py'
      - '.github/workflows/probe-cctv6-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cctv6-fast-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Probe CCTV6 candidates
        run: python3 scripts/probe_cctv6_fast.py
      - name: Publish report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cctv6-fast-probe-report.txt
          if git diff --cached --quiet; then
            echo 'No report changes'
          else
            git commit -m 'Measure fast high-bitrate CCTV6 candidates'
            git pull --rebase -X theirs origin master
            git push
          fi
