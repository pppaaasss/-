name: Publish curated v2 once
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publish-curated-v2-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build balanced verified lineup
        run: python3 scripts/hk_rebuild_curated_from_verified_pool.py
      - name: Validate lineup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def parse(p):
              lines=Path(p).read_text(encoding='utf-8').splitlines(); rows=[]
              for i,l in enumerate(lines[:-1]):
                  if l.startswith('#EXTINF:') and ',' in l:
                      n=l.rsplit(',',1)[-1].strip(); u=lines[i+1].strip()
                      if u.startswith(('http://','https://')): rows.append((n,u))
              return rows
          a=parse('tv.m3u'); b=parse('tv-all.m3u')
          assert a==b, 'tv.m3u and tv-all.m3u differ'
          assert len(a)==400, len(a)
          assert len({u for _,u in a})==400, 'duplicate URL'
          assert not any('cctv8k' in u.lower() for n,u in a if re.search(r'^CCTV-?8$',n,re.I)), 'CCTV8K contamination'
          assert not any('.mp4' in u.lower() for _,u in a[53:]), 'MP4 VOD leaked into non-core'
          print('VALID channels=400 unique_urls=400')
          PY
      - name: Commit production lineup
        run: |
          git config user.name hk-curated-publisher
          git config user.email hk-curated-publisher@users.noreply.github.com
          git add tv.m3u tv-all.m3u harvest/curated-manifest.json
          git diff --cached --check
          git commit -m 'Publish balanced 400-channel Hong Kong verified lineup'
          git push origin HEAD:master
