name: Switch CCTV5+ once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-cctv5plus-once.yml'

permissions:
  contents: write

jobs:
  switch:
    if: contains(github.event.head_commit.message, '[switch-cctv5plus]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Replace only CCTV-5+ primary route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = ['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          new_url = 'http://111.32.21.78/PLTV/88888888/224/3221226399/1.m3u8'
          for fn in files:
              p=Path(fn)
              before=p.read_text(encoding='utf-8')
              lines=before.splitlines()
              hits=0
              for i,line in enumerate(lines[:-1]):
                  if line.startswith('#EXTINF:') and line.rsplit(',',1)[-1].strip() == 'CCTV-5+':
                      if not lines[i+1].startswith(('http://','https://')):
                          raise SystemExit(f'{fn}: CCTV-5+ missing URL line')
                      lines[i+1]=new_url
                      hits += 1
              if hits != 1:
                  raise SystemExit(f'{fn}: expected exactly one CCTV-5+ primary, got {hits}')
              after='\n'.join(lines) + ('\n' if before.endswith('\n') else '')
              p.write_text(after,encoding='utf-8')
          PY
      - name: Verify only CCTV-5+ lines changed
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          expected='http://111.32.21.78/PLTV/88888888/224/3221226399/1.m3u8'
          for fn in files:
              cur=Path(fn).read_text(encoding='utf-8').splitlines()
              old=subprocess.check_output(['git','show',f'HEAD^:{fn}'],text=True).splitlines()
              def mask(lines):
                  out=list(lines)
                  count=0
                  for i,line in enumerate(out[:-1]):
                      if line.startswith('#EXTINF:') and line.rsplit(',',1)[-1].strip()=='CCTV-5+':
                          out[i+1]='__CCTV5PLUS_URL__'; count+=1
                  return out,count
              cm,cc=mask(cur); om,oc=mask(old)
              if cc!=1 or oc!=1:
                  raise SystemExit(f'{fn}: bad CCTV-5+ count current={cc} old={oc}')
              if cm!=om:
                  raise SystemExit(f'{fn}: non-CCTV-5+ content changed')
              idx=next(i for i,l in enumerate(cur[:-1]) if l.startswith('#EXTINF:') and l.rsplit(',',1)[-1].strip()=='CCTV-5+')
              if cur[idx+1] != expected:
                  raise SystemExit(f'{fn}: target URL mismatch')
          print('verified: only CCTV-5+ URL changed in all four playlists')
          PY
      - name: Commit four playlists only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          git diff --cached --quiet && exit 0
          git commit -m 'Switch CCTV-5+ to Tianjin operator route'
          git push origin HEAD:master
