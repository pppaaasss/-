name: Revert home-failed CCTV5+ route once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/revert-cctv5plus-home-fail-once.yml'

permissions:
  contents: write

jobs:
  revert:
    if: contains(github.event.head_commit.message, '[revert-cctv5plus]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert CCTV5+ and blacklist home failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          bad = 'https://myip.pdtvhd.com/Sports/Streams/CCTV5pul.m3u8'
          old = 'http://222.169.85.8:9901/tsfile/live/0116_1.m3u8'
          files = ['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          for fn in files:
              p=Path(fn)
              lines=p.read_text(encoding='utf-8').splitlines()
              found=False
              for i,line in enumerate(lines[:-1]):
                  if line.startswith('#EXTINF:') and line.rsplit(',',1)[-1].strip()=='CCTV-5+':
                      if lines[i+1].strip()!=bad:
                          raise SystemExit(f'{fn}: unexpected current CCTV-5+ route: {lines[i+1].strip()}')
                      lines[i+1]=old
                      found=True
                      break
              if not found:
                  raise SystemExit(f'{fn}: CCTV-5+ not found')
              p.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          fp=Path('config/home-route-feedback.json')
          data=json.loads(fp.read_text(encoding='utf-8'))
          arr=data.setdefault('bad',{}).setdefault('cctv5plus',[])
          if not any(x.get('url')==bad for x in arr if isinstance(x,dict)):
              arr.append({
                  'url': bad,
                  'reason': 'home_unplayable',
                  'observed_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
              })
          data['updated_utc']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          fp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('reverted CCTV-5+ and blacklisted home-failed route')
          PY
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          old='http://222.169.85.8:9901/tsfile/live/0116_1.m3u8'
          bad='https://myip.pdtvhd.com/Sports/Streams/CCTV5pul.m3u8'
          for fn in ['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']:
              text=Path(fn).read_text(encoding='utf-8')
              if old not in text or bad in text:
                  raise SystemExit(f'{fn}: revert verification failed')
          data=json.loads(Path('config/home-route-feedback.json').read_text(encoding='utf-8'))
          assert any(x.get('url')==bad and x.get('reason')=='home_unplayable' for x in data['bad']['cctv5plus'])
          print('verification passed')
          PY
      - name: Commit
        run: |
          git config user.name "home-feedback-publisher"
          git config user.email "home-feedback-publisher@users.noreply.github.com"
          git add tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u config/home-route-feedback.json
          git diff --cached --check
          git commit -m "Revert CCTV5+ route rejected by home playback"
          git push origin HEAD:master
