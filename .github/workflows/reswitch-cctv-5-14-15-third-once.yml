name: Switch CCTV 5 14 15 to third uploaded routes once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/reswitch-cctv-5-14-15-third-once.yml'

permissions:
  contents: write

jobs:
  switch:
    if: contains(github.event.head_commit.message, '[reswitch-cctv-5-14-15-third]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Replace only CCTV 5 14 15
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          targets={
            'CCTV-5':'http://112.30.73.119:9901/tsfile/live/0005_2.m3u8',
            'CCTV-14':'http://74.91.26.218:82/live/cctv14hd.m3u8',
            'CCTV-15':'http://219.147.245.238:25480/newlive/live/hls/16/live.m3u8',
          }
          for fn in files:
              p=Path(fn); before=p.read_text(encoding='utf-8'); lines=before.splitlines(); counts={k:0 for k in targets}
              for i,line in enumerate(lines[:-1]):
                  if not line.startswith('#EXTINF:'): continue
                  name=line.rsplit(',',1)[-1].strip()
                  if name in targets:
                      lines[i+1]=targets[name]; counts[name]+=1
              if counts != {k:1 for k in targets}: raise SystemExit(f'{fn}: bad counts {counts}')
              p.write_text('\n'.join(lines)+('\n' if before.endswith('\n') else ''),encoding='utf-8')
          PY
      - name: Verify target-only changes
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']; names={'CCTV-5','CCTV-14','CCTV-15'}
          def mask(lines):
              x=list(lines); c={n:0 for n in names}
              for i,l in enumerate(x[:-1]):
                  if l.startswith('#EXTINF:'):
                      n=l.rsplit(',',1)[-1].strip()
                      if n in names: x[i+1]=f'__{n}__'; c[n]+=1
              return x,c
          for fn in files:
              cur=Path(fn).read_text(encoding='utf-8').splitlines(); prev=subprocess.check_output(['git','show',f'HEAD^:{fn}'],text=True).splitlines()
              cm,cc=mask(cur); pm,pc=mask(prev)
              if cm!=pm or cc!={n:1 for n in names} or pc!={n:1 for n in names}: raise SystemExit(f'{fn}: unexpected change')
          print('verified target-only change')
          PY
      - name: Commit playlists
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          git diff --cached --quiet && exit 0
          git commit -m 'Switch CCTV-5 CCTV-14 CCTV-15 to third uploaded routes'
          git push origin HEAD:master
