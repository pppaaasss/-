name: Probe weak CCTV upgrades

on:
  push:
    paths:
      - 'scripts/probe_weak_cctv.py'
      - '.github/workflows/probe-weak-cctv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weak-cctv-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Probe weak CCTV candidates
        run: python3 scripts/probe_weak_cctv.py
      - name: Publish report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cctv-weak-upgrade-report.json
          if git diff --cached --quiet; then
            echo 'No report changes'
          else
            git commit -m 'Measure weak CCTV upgrade candidates'
            git pull --rebase -X theirs origin master
            git push
          fi
