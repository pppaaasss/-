name: Revert CCTV4 and CCTV8
on: push
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Revert CCTV4 and CCTV8 home 720p')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Revert routes
        run: |
          for f in tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u; do
            sed -i 's#http://74.91.26.218:82/live/cctv4hd.m3u8#http://221.7.175.154:8445/tsfile/live/1003_1.m3u8?key=txiptv\&playlive=1\&authid=0#g' "$f"
            sed -i 's#http://74.91.26.218:82/live/cctv8hd.m3u8#http://222.169.85.8:9901/tsfile/live/0008_1.m3u8?key=txiptv\&playlive=1\&authid=0#g' "$f"
          done
      - name: Record home failures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/home-route-feedback.json'); d=json.loads(p.read_text())
          for k,u in [('cctv4','http://74.91.26.218:82/live/cctv4hd.m3u8'),('cctv8','http://74.91.26.218:82/live/cctv8hd.m3u8')]:
              a=d.setdefault('bad',{}).setdefault(k,[])
              if not any(x.get('url')==u for x in a): a.append({'url':u,'reason':'home_decoded_720p','observed_utc':'2026-08-28T05:16:57Z'})
          d['updated_utc']='2026-08-28T05:16:57Z'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name home-feedback-publisher
          git config user.email home-feedback-publisher@users.noreply.github.com
          git add tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u config/home-route-feedback.json
          git diff --cached --check
          git commit -m 'Revert CCTV4 and CCTV8 home 720p'
          git push origin HEAD:master
