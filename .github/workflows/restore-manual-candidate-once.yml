name: Restore manual candidate workflow once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/restore-manual-candidate-once.yml'

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, '[restore-manual-candidate-once]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full candidate workflow but keep manual trigger only
        run: |
          git show 61a8bd1155ca01c9b3a7801e50b714bbf89f03ef:.github/workflows/build-candidate.yml > /tmp/build-candidate.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/build-candidate.yml')
          s = p.read_text(encoding='utf-8')
          start = s.index('on:\n')
          end = s.index('permissions:\n')
          s = s[:start] + 'on:\n  workflow_dispatch:\n\n' + s[end:]
          Path('.github/workflows/build-candidate.yml').write_text(s, encoding='utf-8')
          PY
          grep -nE '^(on:|  workflow_dispatch:|  schedule:|  push:|jobs:)' .github/workflows/build-candidate.yml
          test "$(grep -c '^  workflow_dispatch:$' .github/workflows/build-candidate.yml)" -eq 1
          test "$(grep -c '^  schedule:$' .github/workflows/build-candidate.yml || true)" -eq 0
          test "$(grep -c '^  push:$' .github/workflows/build-candidate.yml || true)" -eq 0
          grep -q '^jobs:$' .github/workflows/build-candidate.yml
      - name: Commit restored manual workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+pppaaasss@users.noreply.github.com'
          git add .github/workflows/build-candidate.yml
          git commit -m 'Restore manual-only candidate workflow'
          git push origin HEAD:master
