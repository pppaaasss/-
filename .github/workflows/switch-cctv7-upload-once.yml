name: Switch CCTV7 to uploaded route once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-cctv7-upload-once.yml'

permissions:
  contents: write

jobs:
  switch:
    if: contains(github.event.head_commit.message, '[switch-cctv7-upload]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Replace CCTV-7 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          target='http://219.147.245.238:25480/newlive/live/hls/8/live.m3u8'
          for fn in files:
              p=Path(fn); before=p.read_text(encoding='utf-8'); lines=before.splitlines(); hits=0
              for i,line in enumerate(lines[:-1]):
                  if not line.startswith('#EXTINF:'): continue
                  name=line.rsplit(',',1)[-1].strip()
                  if name in ('CCTV-7','CCTV7'):
                      lines[i+1]=target; hits+=1
              if hits!=1: raise SystemExit(f'{fn}: expected exactly one CCTV-7, got {hits}')
              p.write_text('\n'.join(lines)+('\n' if before.endswith('\n') else ''),encoding='utf-8')
          PY
      - name: Verify only CCTV-7 changed
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          def mask(lines):
              x=list(lines); c=0
              for i,l in enumerate(x[:-1]):
                  if l.startswith('#EXTINF:') and l.rsplit(',',1)[-1].strip() in ('CCTV-7','CCTV7'):
                      x[i+1]='__CCTV7__'; c+=1
              return x,c
          for fn in files:
              cur=Path(fn).read_text(encoding='utf-8').splitlines(); prev=subprocess.check_output(['git','show',f'HEAD^:{fn}'],text=True).splitlines()
              cm,cc=mask(cur); pm,pc=mask(prev)
              if cm!=pm or cc!=1 or pc!=1: raise SystemExit(f'{fn}: unexpected change')
          print('verified CCTV-7 only')
          PY
      - name: Commit playlists
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          git diff --cached --quiet && exit 0
          git commit -m 'Switch CCTV-7 to uploaded route'
          git push origin HEAD:master
