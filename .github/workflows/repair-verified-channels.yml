name: Repair verified TV identities

on:
  push:
    paths:
      - 'scripts/repair_verified_channels.py'
      - 'scripts/final_migu_guard.py'
      - 'scripts/apply_best_fan_high_bitrate.py'
      - 'tests/test_apply_best_fan_high_bitrate.py'
      - '.github/workflows/repair-verified-channels.yml'
  schedule:
    - cron: '27 */4 * * *'
    - cron: '57 10-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aptv-playlist-writes
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest playlists
        run: |
          git fetch origin master
          git checkout -B master origin/master
      - name: Repair verified identities and merge Migu catalog
        run: python3 scripts/repair_verified_channels.py
      - name: Final Migu identity and grouping guard
        run: python3 scripts/final_migu_guard.py
      - name: Reapply best-fan routes and TV-balanced CCTV profile
        run: python3 scripts/apply_best_fan_high_bitrate.py
      - name: Publish domestic repair and Migu catalog diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u migu-catalog-report.txt
          if git diff --cached --quiet; then
            echo 'No domestic/Migu catalog changes'
          else
            git commit -m 'Merge better and missing Migu TV channels'
            git pull --rebase -X theirs origin master
            git push
          fi
