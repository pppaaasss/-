name: Verify home route policy once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-home-policy-once.yml'

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-home-route-policy]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run offline policy tests
        run: |
          python3 -m unittest tests.test_home_route_policy -v
          python3 -m unittest tests.test_candidate_policy -v
          python3 -m unittest tests.test_release_safety -v
      - name: Verify real feedback registry loads rejected routes
        run: |
          python3 - <<'PY'
          from scripts.home_route_policy import rejected_urls
          bad = rejected_urls()
          expected = {
              'http://173.208.212.130:8181/1080p/cctv2.m3u8',
              'http://58.56.162.102:4466/newlive/live/hls/16/live.m3u8',
          }
          missing = expected - bad
          if missing:
              raise SystemExit(f'missing rejected routes: {sorted(missing)}')
          print(f'home feedback hard rejects: {len(bad)} routes')
          PY
      - name: Prove production playlists untouched
        run: |
          git diff --exit-code -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          sha256sum tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
