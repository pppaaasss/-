name: Rebuild APTV playlists

on:
  push:
    paths:
      - 'scripts/build_playlist.py'
      - '.github/workflows/build-tv.yml'
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-aptv-playlists
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe and build playlists
        env:
          TARGET_STABLE: '200'
          TARGET_ALL: '320'
          PROBE_WORKERS: '28'
          PROBE_TIMEOUT: '9'
        run: python3 scripts/build_playlist.py
      - name: Publish refreshed playlists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv.m3u tv-all.m3u build-report.txt
          if git diff --cached --quiet; then
            echo 'No playlist changes'
          else
            git commit -m 'Refresh measured APTV playlists'
            git push
          fi
