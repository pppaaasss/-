name: Production playlists frozen

# Safety interlock installed before the real quality audit. Candidate generation
# is enabled only after the read-only audit is reviewed. This workflow cannot
# write or publish the four production playlists.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo 'Production rebuild is frozen. Use the read-only quality audit first.'
          sha256sum tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
