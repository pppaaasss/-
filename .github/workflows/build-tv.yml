name: Rebuild APTV playlists

on:
  push:
    paths:
      - 'scripts/build_playlist.py'
      - 'tests/test_build_playlist.py'
      - '.github/workflows/build-tv.yml'
  schedule:
    # 00:17 and 12:17 in Beijing/Singapore (UTC+8).
    - cron: '17 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-aptv-playlists
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Probe and build playlists
        env:
          TARGET_STABLE: '800'
          MIN_STABLE: '760'
          TARGET_ALL: '1000'
          SOURCE_WORKERS: '12'
          PROBE_WORKERS: '56'
          PROBE_TIMEOUT: '8'
        run: python3 scripts/build_playlist.py
      - name: Publish refreshed playlists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv.m3u tv-all.m3u build-report.txt
          if git diff --cached --quiet; then
            echo 'No playlist changes'
          else
            git commit -m 'Refresh measured APTV playlists'
            git push
          fi
