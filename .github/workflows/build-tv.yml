name: Rebuild APTV playlists

on:
  push:
    paths:
      - 'scripts/build_playlist.py'
      - 'scripts/build_playlist_with_upstreams.py'
      - 'scripts/repair_cctv5.py'
      - 'scripts/upgrade_core_50fps.py'
      - 'scripts/upgrade_core_50hz.py'
      - 'scripts/clean_single_station.py'
      - 'scripts/apply_viewer_profile.py'
      - 'scripts/apply_best_fan_high_bitrate.py'
      - 'scripts/import_best_fan_pay_unchecked.py'
      - 'scripts/channel_regions.py'
      - 'tests/test_build_playlist.py'
      - 'tests/test_apply_best_fan_high_bitrate.py'
      - 'tests/test_repair_cctv5_pair.py'
      - 'tests/test_apply_viewer_profile.py'
      - 'tests/test_clean_single_station.py'
      - '.github/workflows/build-tv.yml'
  schedule:
    # Baseline refresh every four hours, offset from the top-of-hour Actions rush.
    - cron: '17 */4 * * *'
    # China/Singapore evening peak (18:00-23:00 UTC+8): sample hourly so the
    # rolling history is biased toward the period where congestion matters most.
    - cron: '47 10-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # The short CCTV pair workflow writes the same playlist files. Serialize
  # both workflows so one cannot advance master during the other's publish.
  group: aptv-playlist-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Probe all upstreams and build quality-first playlists
        id: playlist_build
        # A broad rebuild can fail its family-channel safety gate while the
        # currently published playlists are still usable. Keep going so the
        # rescue, 50 Hz promotion and final de-dup passes can repair it.
        continue-on-error: true
        env:
          TARGET_STABLE: '420'
          MIN_STABLE: '280'
          TARGET_MAIN: '450'
          MIN_MAIN: '430'
          TARGET_ALL: '560'
          TARGET_EASY: '180'
          MIN_EASY: '55'
          SOURCE_WORKERS: '12'
          PROBE_WORKERS: '56'
          PROBE_TIMEOUT: '8'
          CORE_VARIANTS_PER_CHANNEL: '24'
          HISTORY_WINDOW: '24'
        run: python3 scripts/build_playlist_with_upstreams.py
      - name: Ensure ffprobe is available for 1080p50/1080i50 verification
        if: ${{ !cancelled() }}
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Promote verified 1080p50 and native 1080i50 routes
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 scripts/upgrade_core_50hz.py
      - name: Keep one visible tile per CCTV and satellite station
        if: ${{ !cancelled() }}
        run: python3 scripts/clean_single_station.py
      - name: Enforce local Chinese, Taiwan, Japan and no-English profile
        if: ${{ !cancelled() }}
        run: python3 scripts/apply_viewer_profile.py
      - name: Final independent CCTV-5 and CCTV-5+ rescue
        if: ${{ !cancelled() }}
        run: python3 scripts/repair_cctv5.py
      # best-fan is already part of the measured candidate pool. Do not run the
      # old static best-fan override here because it could replace a healthy
      # 1080p winner with one of the old hard-coded 720p CCTV routes.
      - name: Pin viewer-confirmed CCTV-1 CCTV-4 and Hunan routes
        if: ${{ !cancelled() }}
        run: python3 scripts/pin_viewer_channels.py
      - name: Mirror best-fan pay channels without stream testing
        if: ${{ !cancelled() }}
        run: python3 scripts/import_best_fan_pay_unchecked.py
      - name: Install frame-audit image dependency
        if: ${{ !cancelled() && github.event_name == 'push' && contains(github.event.head_commit.message, '[frame-audit]') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow
      - name: Capture CCTV and satellite frames for identity review
        if: ${{ !cancelled() && github.event_name == 'push' && contains(github.event.head_commit.message, '[frame-audit]') }}
        run: python3 scripts/audit_tv_frames.py --playlist tv-easy.m3u --output frame-audit --workers 8 --timeout 30 || true
      - name: Upload family-channel frame audit
        if: ${{ !cancelled() && github.event_name == 'push' && contains(github.event.head_commit.message, '[frame-audit]') }}
        uses: actions/upload-artifact@v4
        with:
          name: family-channel-frame-audit
          path: frame-audit/
          retention-days: 3
      - name: Publish refreshed playlists
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u health-history.json build-report.txt fps-report.txt
          if git diff --cached --quiet; then
            echo 'No playlist changes'
          else
            git commit -m 'Refresh measured APTV playlists'
            # Independent probe/report workflows may advance master while this
            # long build is running. Rebase the generated playlist commit so a
            # harmless concurrent report push cannot make publication fail.
            # Generated files are authoritative for this completed probe. In
            # the unlikely event another report commit advanced master, keep
            # this run's freshly measured versions while replaying the commit.
            git pull --rebase -X theirs --autostash origin master
            git push
          fi
      - name: Propagate broad playlist build failure after rescue publish
        if: ${{ !cancelled() && steps.playlist_build.outcome == 'failure' }}
        run: exit 1
