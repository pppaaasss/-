name: Build IPTV source

on:
  push:
    paths:
      - '.github/workflows/build-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild tv.m3u
        shell: bash
        run: |
          cat > /tmp/tv.m3u.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/tv.m3u.gz.b64 | gzip -d > tv.m3u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv.m3u
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update tv.m3u'
            git push
          fi
