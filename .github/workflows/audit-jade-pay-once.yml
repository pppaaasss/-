name: Audit Jade and pay alternatives once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/audit-jade-pay-once.yml'

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[audit-jade-pay-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Probe Jade and pay alternatives three times
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          from pathlib import Path

          ROUTES = {
            'Jade-edge6a': 'https://edge6a.v2h-cdn.com/jade/jade.stream/chunklist.m3u8',
            'Jade-edge6a-playlist': 'https://edge6a.v2h-cdn.com/jade/jade.stream/playlist.m3u8',
            'Jade-113': 'http://113.117.74.45:8081/hls/67/index.m3u8',
            'Jade-astradamy': 'https://live.astradamy.com/tvbfc/index.m3u8',
            'Jade-101': 'http://101.35.240.114:88/live.php?id=翡翠台',
            'Pay-央视台球': 'http://39.134.242.92:80/180000001002/00000001000000000091000000244803/main.m3u8',
            'Pay-世界地理': 'http://39.134.242.92:80/180000001002/00000001000000000091000000244805/main.m3u8',
            'Pay-怀旧剧场': 'http://39.134.242.92:80/180000001002/00000001000000000091000000244806/main.m3u8',
            'Pay-风云剧场': 'http://39.134.242.92:80/180000001002/00000001000000000091000000244807/main.m3u8',
            'Pay-第一剧场': 'http://39.134.242.92:80/180000001002/00000001000000000091000000244808/main.m3u8',
            'Pay-风云音乐': 'http://39.134.242.92:80/180000001002/00000001000000000091000000244809/main.m3u8',
            'Pay-文化精品': 'http://39.134.242.92:80/180000001002/00000001000000000091000000244810/main.m3u8',
          }

          def probe(url):
            cmd = ['ffprobe','-v','error','-rw_timeout','8000000','-select_streams','v:0',
                   '-show_entries','stream=width,height,codec_name,r_frame_rate','-of','json',url]
            try:
              cp = subprocess.run(cmd, capture_output=True, text=True, timeout=11)
              if cp.returncode:
                return {'ok':0,'error':(cp.stderr or f'rc={cp.returncode}').strip().replace('\n',' ')[:160]}
              data=json.loads(cp.stdout or '{}')
              s=(data.get('streams') or [{}])[0]
              return {'ok':1,'width':int(s.get('width') or 0),'height':int(s.get('height') or 0),'codec':s.get('codec_name',''),'fps':s.get('r_frame_rate','')}
            except subprocess.TimeoutExpired:
              return {'ok':0,'error':'timeout'}
            except Exception as e:
              return {'ok':0,'error':f'{type(e).__name__}:{e}'[:160]}

          lines=[]
          for name,url in ROUTES.items():
            rounds=[]
            for i in range(3):
              rounds.append(probe(url))
              if i<2: time.sleep(1)
            oks=sum(r.get('ok',0) for r in rounds)
            heights=[r.get('height',0) for r in rounds if r.get('ok')]
            width=max([r.get('width',0) for r in rounds if r.get('ok')] or [0])
            height=min(heights) if heights else 0
            codec=next((r.get('codec','') for r in rounds if r.get('ok')), '')
            fps=next((r.get('fps','') for r in rounds if r.get('ok')), '')
            errors=' || '.join(r.get('error','') for r in rounds if not r.get('ok'))
            lines.append(f'RESULT|{name}|checks_ok={oks}|size={width}x{height}|codec={codec}|fps={fps}|url={url}|errors={errors}')
          text='\n'.join(lines)+'\n'
          print(text)
          Path('jade-pay-audit.txt').write_text(text,encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jade-pay-audit-${{ github.run_id }}
          path: jade-pay-audit.txt
          retention-days: 3
