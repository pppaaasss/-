name: Hotfix CCTV5 pair

on:
  push:
    paths:
      - 'scripts/hotfix_cctv5_pair.py'
      - 'scripts/repair_cctv5.py'
      - 'tests/test_repair_cctv5_pair.py'
      - '.github/workflows/hotfix-cctv5.yml'

permissions:
  contents: write

concurrency:
  group: aptv-playlist-writes
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest published playlists
        run: |
          git fetch origin master
          git checkout -B master origin/master
      - name: Run CCTV5 pair tests
        run: python3 -m unittest discover -s tests -p 'test_repair_cctv5_pair.py' -v
      - name: Apply independent CCTV5 pair rescue
        run: python3 scripts/hotfix_cctv5_pair.py
      - name: Publish hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u build-report.txt
          if git diff --cached --quiet; then
            echo 'No playlist changes'
          else
            git commit -m 'Hotfix independent CCTV5 pair routes'
            git pull --rebase -X theirs origin master
            git push
          fi
