name: Audit transport-aware curated lineup once
on:
  push:
    branches: [master]
    paths: ['.github/workflows/audit-curated-transport-once.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run final audit
        run: python3 scripts/audit_curated_lineup.py
      - name: Commit audit report
        run: |
          git config user.name curated-audit
          git config user.email curated-audit@users.noreply.github.com
          git add audit/curated-lineup-audit-2026-08-28.json audit/curated-lineup-audit-2026-08-28.txt
          git diff --cached --check
          git commit -m 'Refresh transport-aware curated lineup audit'
          git push origin HEAD:master
