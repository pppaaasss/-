name: Rebuild HK Taiwan and Chinese pay once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rebuild-regional-pay-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[rebuild-regional-pay]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Rebuild only target regional groups
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          FILES=['tv-easy.m3u','tv.m3u','tv-all.m3u']
          JADE='http://r.jdshipin.com/n90gt'
          TVBS_1080='https://ha.msbot.dpdns.org/4gtv_api.php?id=183'
          PAY=[
            ('CCTV第一剧场','http://113.207.84.197:8090/__cl/cg:live/__c/diyijuchangHD/__op/default/__f/index.m3u8'),
            ('CCTV怀旧剧场','http://113.207.84.197:8090/__cl/cg:live/__c/hjjcHD/__op/default/__f/index.m3u8'),
            ('CCTV风云剧场','http://113.207.84.197:8090/__cl/cg:live/__c/fyjcHD/__op/default/__f/index.m3u8'),
            ('CCTV风云音乐','http://113.207.84.197:8090/__cl/cg:live/__c/fyyyHD/__op/default/__f/index.m3u8'),
            ('CCTV风云足球','http://113.207.84.197:8090/__cl/cg:live/__c/fyzqHD/__op/default/__f/index.m3u8'),
            ('CCTV兵器科技','http://113.207.84.197:8090/__cl/cg:live/__c/bqkjHD/__op/default/__f/index.m3u8'),
          ]

          def group_of(meta):
            m=re.search(r'group-title="([^"]*)"',meta)
            return m.group(1) if m else ''
          def name_of(meta):
            return meta.rsplit(',',1)[-1].strip()

          for fn in FILES:
            p=Path(fn)
            before=p.read_text(encoding='utf-8',errors='replace')
            lines=before.splitlines()
            out=[]; i=0; jade_added=False
            while i < len(lines):
              line=lines[i]
              if not line.startswith('#EXTINF:'):
                out.append(line); i+=1; continue
              meta=line
              url=lines[i+1].strip() if i+1<len(lines) else ''
              group=group_of(meta); name=name_of(meta)
              i+=2

              if group == '中文付费':
                continue
              if group == '台湾' and 'raw.githubusercontent.com/ChiSheng9/iptv/master/TV' in url:
                continue
              if group == '香港' and ('cdn6.cc.cd' in url or 'cdn6.163189.xyz' in url):
                continue
              if group == '香港' and ('翡翠台' in name or name == 'TVB Jade'):
                if jade_added:
                  continue
                meta='#EXTINF:-1 tvg-name="翡翠台" tvg-id="翡翠台" tvg-logo="https://live.fanmingming.cn/tv/翡翠台.png" group-title="香港",翡翠台'
                url=JADE
                jade_added=True
              if group == '台湾' and name == 'TVBS':
                url=TVBS_1080
              out.extend([meta,url])

            if not jade_added:
              out.extend([
                '#EXTINF:-1 tvg-name="翡翠台" tvg-id="翡翠台" tvg-logo="https://live.fanmingming.cn/tv/翡翠台.png" group-title="香港",翡翠台',
                JADE,
              ])

            out.append('')
            out.append('# 中文付费：2026-08-27 重建，移除失效 NewTV/cqccn 线路')
            for name,url in PAY:
              out.append(f'#EXTINF:-1 group-title="中文付费",{name}')
              out.append(url)

            text='\n'.join(out).rstrip()+'\n'
            p.write_text(text,encoding='utf-8')
          PY
      - name: Verify Macau and non-target groups unchanged
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u']
          targets={'香港','台湾','中文付费'}
          def entries(text):
            lines=text.splitlines(); out=[]; i=0
            while i<len(lines):
              if lines[i].startswith('#EXTINF:'):
                meta=lines[i]; url=lines[i+1].strip() if i+1<len(lines) else ''
                m=re.search(r'group-title="([^"]*)"',meta); group=m.group(1) if m else ''
                out.append((group,meta,url)); i+=2
              else: i+=1
            return out
          for fn in files:
            before=subprocess.check_output(['git','show',f'HEAD^:{fn}'],text=True)
            after=Path(fn).read_text(encoding='utf-8')
            b=[e for e in entries(before) if e[0] not in targets]
            a=[e for e in entries(after) if e[0] not in targets]
            if a!=b:
              raise SystemExit(f'{fn}: non-target group changed')
            bmo=[e for e in entries(before) if e[0]=='澳门']
            amo=[e for e in entries(after) if e[0]=='澳门']
            if amo!=bmo:
              raise SystemExit(f'{fn}: Macau changed')
            pay=[e for e in entries(after) if e[0]=='中文付费']
            if len(pay)!=6:
              raise SystemExit(f'{fn}: expected 6 pay channels, got {len(pay)}')
            jade=[e for e in entries(after) if e[0]=='香港' and '翡翠台' in e[1]]
            if len(jade)!=1 or jade[0][2] != 'http://r.jdshipin.com/n90gt':
              raise SystemExit(f'{fn}: jade route not normalized')
          print('verified target-only regional rebuild')
          PY
      - name: Commit three playlists only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tv-easy.m3u tv.m3u tv-all.m3u
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild Hong Kong Taiwan and Chinese pay groups'
          git push origin HEAD:master
