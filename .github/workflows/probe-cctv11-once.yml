name: Probe CCTV11 alternate routes once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/probe-cctv11-once.yml'

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe-cctv11]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Probe CCTV-11 candidates twice in parallel
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, subprocess, time
          candidates = [
            ('operator-61', 'http://61.136.172.236:9901/tsfile/live/0011_1.m3u8'),
            ('kankan', 'https://play.kankanlive.com/live/1698423476198918.m3u8'),
            ('hls-183', 'http://183.11.239.36:808/hls/29/index.m3u8'),
            ('operator-153', 'http://153.0.171.163:9901/tsfile/live/1010_1.m3u8?key=txiptv&playlive=1&authid=0'),
            ('cmcc-ipv6', 'http://[2409:8087:8:21::18]:6610/otttv.bj.chinamobile.com/PLTV/88888888/224/3221226334/1.m3u8?'),
            ('overseas-74', 'http://74.91.26.218:82/live/cctv11hd.m3u8'),
          ]
          def once(url):
              cmd=['ffprobe','-v','error','-rw_timeout','9000000','-select_streams','v:0','-show_entries','stream=width,height,codec_name','-of','json',url]
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=12)
                  if p.returncode:
                      return {'ok':False,'error':(p.stderr or '').strip()[-180:]}
                  s=(json.loads(p.stdout or '{}').get('streams') or [None])[0]
                  if not s: return {'ok':False,'error':'no_video_stream'}
                  return {'ok':True,'width':int(s.get('width') or 0),'height':int(s.get('height') or 0),'codec':s.get('codec_name') or ''}
              except Exception as e:
                  return {'ok':False,'error':f'{type(e).__name__}:{e}'}
          def check(item):
              name,url=item
              a=once(url); time.sleep(.5); b=once(url)
              row={'name':name,'url':url,'first':a,'second':b}
              row['verified_1080']=bool(a.get('ok') and b.get('ok') and min(a.get('height',0),b.get('height',0))>=1080)
              return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=len(candidates)) as ex:
              results=list(ex.map(check,candidates))
          for row in results: print('CCTV11_PROBE',json.dumps(row,ensure_ascii=False))
          print('CCTV11_WINNERS',json.dumps([r for r in results if r['verified_1080']],ensure_ascii=False))
          PY
      - name: Prove production playlists untouched
        run: git diff --exit-code -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
