name: Switch CCTV2 and CCTV15 to verified routes once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-cctv2-cctv15-verified-once.yml'

permissions:
  contents: write

jobs:
  switch:
    if: contains(github.event.head_commit.message, '[switch-cctv2-cctv15-verified]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Replace CCTV-2 and CCTV-15 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          targets={
            'CCTV-2':'http://221.7.175.154:8445/tsfile/live/1001_1.m3u8?key=txiptv&playlive=1&authid=0',
            'CCTV-15':'http://58.56.162.102:4466/newlive/live/hls/16/live.m3u8',
          }
          aliases={'CCTV2':'CCTV-2','CCTV15':'CCTV-15'}
          for fn in files:
              p=Path(fn); before=p.read_text(encoding='utf-8'); lines=before.splitlines(); counts={k:0 for k in targets}
              for i,line in enumerate(lines[:-1]):
                  if not line.startswith('#EXTINF:'): continue
                  name=line.rsplit(',',1)[-1].strip(); key=aliases.get(name,name)
                  if key in targets:
                      lines[i+1]=targets[key]; counts[key]+=1
              if counts != {k:1 for k in targets}: raise SystemExit(f'{fn}: bad counts {counts}')
              p.write_text('\n'.join(lines)+('\n' if before.endswith('\n') else ''),encoding='utf-8')
          PY
      - name: Verify target-only changes
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']; names={'CCTV-2','CCTV-15'}
          aliases={'CCTV2':'CCTV-2','CCTV15':'CCTV-15'}
          expected={
            'CCTV-2':'http://221.7.175.154:8445/tsfile/live/1001_1.m3u8?key=txiptv&playlive=1&authid=0',
            'CCTV-15':'http://58.56.162.102:4466/newlive/live/hls/16/live.m3u8',
          }
          def mask(lines):
              x=list(lines); c={n:0 for n in names}
              for i,l in enumerate(x[:-1]):
                  if l.startswith('#EXTINF:'):
                      raw=l.rsplit(',',1)[-1].strip(); n=aliases.get(raw,raw)
                      if n in names: x[i+1]=f'__{n}__'; c[n]+=1
              return x,c
          for fn in files:
              cur=Path(fn).read_text(encoding='utf-8').splitlines(); prev=subprocess.check_output(['git','show',f'HEAD^:{fn}'],text=True).splitlines()
              cm,cc=mask(cur); pm,pc=mask(prev)
              if cm!=pm or cc!={n:1 for n in names} or pc!={n:1 for n in names}: raise SystemExit(f'{fn}: unexpected change')
              for n,url in expected.items():
                  idx=next(i for i,l in enumerate(cur[:-1]) if l.startswith('#EXTINF:') and aliases.get(l.rsplit(',',1)[-1].strip(),l.rsplit(',',1)[-1].strip())==n)
                  if cur[idx+1]!=url: raise SystemExit(f'{fn}: wrong {n} route')
          print('verified CCTV-2 and CCTV-15 only')
          PY
      - name: Commit playlists
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          git diff --cached --quiet && exit 0
          git commit -m 'Switch CCTV-2 and CCTV-15 to verified 1080 routes'
          git push origin HEAD:master
