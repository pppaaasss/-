name: Switch CCTV2 to next source only once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-cctv2-next-only-once.yml'

permissions:
  contents: write

jobs:
  switch:
    if: contains(github.event.head_commit.message, '[switch-cctv2-next-only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Replace CCTV-2 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          target='http://112.46.105.20:8009/hls/502/index.m3u8'
          aliases={'CCTV2','CCTV-2'}
          for fn in files:
              p=Path(fn); before=p.read_text(encoding='utf-8'); lines=before.splitlines(); hits=0
              for i,line in enumerate(lines[:-1]):
                  if line.startswith('#EXTINF:') and line.rsplit(',',1)[-1].strip() in aliases:
                      lines[i+1]=target; hits+=1
              if hits!=1: raise SystemExit(f'{fn}: expected one CCTV-2, got {hits}')
              p.write_text('\n'.join(lines)+('\n' if before.endswith('\n') else ''),encoding='utf-8')
          PY
      - name: Verify only CCTV-2 changed and CCTV-15 untouched
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          aliases={'CCTV2','CCTV-2'}
          expected='http://112.46.105.20:8009/hls/502/index.m3u8'
          for fn in files:
              cur=Path(fn).read_text(encoding='utf-8').splitlines(); prev=subprocess.check_output(['git','show',f'HEAD^:{fn}'],text=True).splitlines()
              def masked(x):
                  y=list(x); n=0
                  for i,l in enumerate(y[:-1]):
                      if l.startswith('#EXTINF:') and l.rsplit(',',1)[-1].strip() in aliases:
                          y[i+1]='__CCTV2__'; n+=1
                  return y,n
              cm,cc=masked(cur); pm,pc=masked(prev)
              if cm!=pm or cc!=1 or pc!=1: raise SystemExit(f'{fn}: unexpected non-CCTV2 change')
              idx=next(i for i,l in enumerate(cur[:-1]) if l.startswith('#EXTINF:') and l.rsplit(',',1)[-1].strip() in aliases)
              if cur[idx+1]!=expected: raise SystemExit(f'{fn}: wrong CCTV2 route')
          print('verified CCTV-2 only; CCTV-15 untouched')
          PY
      - name: Commit playlists
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          git diff --cached --quiet && exit 0
          git commit -m 'Switch CCTV-2 to next alternate source'
          git push origin HEAD:master
