name: Publish station-only curated lineup once
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publish-curated-station-only-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build station-only lineup
        run: python3 scripts/hk_rebuild_curated_station_only.py
      - name: Validate station-only lineup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('tv.m3u').read_text(encoding='utf-8').splitlines(); rows=[]
          for i,l in enumerate(lines[:-1]):
              if l.startswith('#EXTINF:') and ',' in l:
                  n=l.rsplit(',',1)[-1].strip(); u=lines[i+1].strip(); gm=re.search(r'group-title="([^"]+)"',l)
                  if u.startswith(('http://','https://')): rows.append((n,u,gm.group(1) if gm else ''))
          assert len(rows)==400,len(rows)
          assert len({n.casefold() for n,_,_ in rows})==400,'duplicate names'
          assert len({u for _,u,_ in rows})==400,'duplicate URLs'
          assert not any(g=='卫视台' for _,_,g in rows[53:]),'non-core satellite duplicate leaked'
          bad=re.compile(r'(?:春晚|第一季|第二季|第三季|第四季|第五季|虎牙[-—]|斗鱼[-—]|斗魚[-—]|iPanda|自然保护区|自然保護區|景区直播|景區直播|监控|監控|CGTN.*(?:英语|英文|法语|法語|西语|西語|阿语|阿語|俄语|俄語)|「英文」|【英文】|[\uac00-\ud7af])',re.I)
          badrows=[n for n,_,_ in rows[53:] if bad.search(n)]
          assert not badrows,badrows[:20]
          assert not any('.mp4' in u.lower() for _,u,_ in rows[53:]),'MP4 leaked'
          assert Path('tv.m3u').read_text(encoding='utf-8')==Path('tv-all.m3u').read_text(encoding='utf-8')
          print('STATION_ONLY_VALID channels=400 unique_urls=400')
          PY
      - name: Commit production lineup
        run: |
          git config user.name hk-curated-publisher
          git config user.email hk-curated-publisher@users.noreply.github.com
          git add tv.m3u tv-all.m3u harvest/curated-manifest.json
          git diff --cached --check
          git commit -m 'Publish station-only Hong Kong verified lineup'
          git push origin HEAD:master
