name: Build public IPTV source

on:
  push:
    paths:
      - '.github/workflows/build-tv-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write tv.m3u
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > tv.m3u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv.m3u
          git commit -m 'Publish tv.m3u' || exit 0
          git push
