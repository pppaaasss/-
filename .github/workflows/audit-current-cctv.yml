name: Audit current CCTV quality

on:
  push:
    paths:
      - 'scripts/audit_current_cctv.py'
      - '.github/workflows/audit-current-cctv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-cctv-quality-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Audit current CCTV lineup
        run: python3 scripts/audit_current_cctv.py
      - name: Upload report only as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctv-current-quality-${{ github.run_id }}
          path: cctv-current-quality-report.txt
          if-no-files-found: warn
          retention-days: 7
