name: Roll back production TV playlists

on:
  workflow_dispatch:
    inputs:
      confirm_rollback:
        description: 'Type ROLLBACK to restore the previous production commit'
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: production-publish-lock
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ inputs.confirm_rollback == 'ROLLBACK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve recorded previous production commit
        id: previous
        run: |
          test -f candidate/last-production.json
          previous="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('candidate/last-production.json').read_text(encoding='utf-8'))
          print(data.get('previous_commit',''))
          PY
          )"
          test -n "$previous"
          git cat-file -e "$previous^{commit}"
          echo "sha=$previous" >> "$GITHUB_OUTPUT"

      - name: Restore all four formal playlists from previous commit
        run: |
          git checkout '${{ steps.previous.outputs.sha }}' -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          for f in tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u; do
            test -s "$f"
            head -n 1 "$f" | grep -q '^#EXTM3U'
          done

      - name: Commit rollback under production lock
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$(git rev-parse HEAD)" || {
            echo 'master moved during rollback; refusing overwrite'
            exit 1
          }
          git add tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          if git diff --cached --quiet; then
            echo 'Production already matches previous version'
            exit 0
          fi
          bad="$(git diff --cached --name-only | grep -Ev '^(tv-easy\.m3u|tv\.m3u|tv-all\.m3u|tv-core\.m3u)$' || true)"
          test -z "$bad"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+pppaaasss@users.noreply.github.com'
          git commit -m 'Rollback production TV playlists'
          git push origin HEAD:master
