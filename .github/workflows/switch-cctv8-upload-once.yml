name: Switch CCTV8 to uploaded route once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-cctv8-upload-once.yml'

permissions:
  contents: write

jobs:
  switch:
    if: contains(github.event.head_commit.message, '[switch-cctv8-upload]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Replace CCTV-8 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          target='http://222.169.85.8:9901/tsfile/live/0008_1.m3u8?key=txiptv&playlive=1&authid=0'
          for fn in files:
              p=Path(fn); before=p.read_text(encoding='utf-8'); lines=before.splitlines(); hits=0
              for i,line in enumerate(lines[:-1]):
                  if not line.startswith('#EXTINF:'):
                      continue
                  name=line.rsplit(',',1)[-1].strip()
                  if name in ('CCTV-8','CCTV8'):
                      if '8K' in line.upper() or '8K' in name.upper():
                          raise SystemExit(f'{fn}: CCTV-8 identity conflict')
                      if not lines[i+1].startswith(('http://','https://')):
                          raise SystemExit(f'{fn}: CCTV-8 missing URL')
                      lines[i+1]=target; hits+=1
              if hits!=1:
                  raise SystemExit(f'{fn}: expected exactly one CCTV-8, got {hits}')
              p.write_text('\n'.join(lines)+('\n' if before.endswith('\n') else ''),encoding='utf-8')
          PY
      - name: Verify only CCTV-8 URL changed
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          expected='http://222.169.85.8:9901/tsfile/live/0008_1.m3u8?key=txiptv&playlive=1&authid=0'
          def mask(lines):
              x=list(lines); c=0
              for i,l in enumerate(x[:-1]):
                  if l.startswith('#EXTINF:') and l.rsplit(',',1)[-1].strip() in ('CCTV-8','CCTV8'):
                      x[i+1]='__CCTV8_URL__'; c+=1
              return x,c
          for fn in files:
              cur=Path(fn).read_text(encoding='utf-8').splitlines()
              prev=subprocess.check_output(['git','show',f'HEAD^:{fn}'],text=True).splitlines()
              cm,cc=mask(cur); pm,pc=mask(prev)
              if cc!=1 or pc!=1 or cm!=pm:
                  raise SystemExit(f'{fn}: unexpected non-CCTV8 change')
              idx=next(i for i,l in enumerate(cur[:-1]) if l.startswith('#EXTINF:') and l.rsplit(',',1)[-1].strip() in ('CCTV-8','CCTV8'))
              if cur[idx+1]!=expected or 'cctv8k' in cur[idx+1].lower():
                  raise SystemExit(f'{fn}: wrong CCTV-8 route')
          print('verified: only CCTV-8 changed in all four playlists')
          PY
      - name: Commit playlists
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          git diff --cached --quiet && exit 0
          git commit -m 'Switch CCTV-8 to uploaded route'
          git push origin HEAD:master
