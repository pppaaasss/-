name: Validate quality-aware core selector once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/test-quality-aware-core-selector-once.yml'

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[test-quality-core]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          python3 -m py_compile scripts/hk_select_verified_core.py scripts/hk_finalize_verified_pool.py
          bash -n scripts/hk_cycle.sh
      - name: Offline quality-aware selection checks
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import hk_select_verified_core as s
          import hk_finalize_verified_pool as f

          def row(url,height,bitrate=3.0,speed=8.0,codec='h264',host=None):
              return {'url':url,'hk_verified':{'height':height,'width':1920,'codec':codec,'bitrate_mbps':bitrate,'segment_ok':True,'segment_mbps':speed,'startup_s':0.3}}

          r720=row('http://a.example/720.m3u8',720,5.0,30.0)
          r1080=row('http://b.example/1080.m3u8',1080,3.0,8.0)
          low=row('http://c.example/low.m3u8',1080,0.7,20.0)
          r4k=row('http://d.example/4k.m3u8',2160,8.0,20.0,'hevc')
          assert not s.evidence_ok(r720,'CCTV-5')
          assert s.evidence_ok(r1080,'CCTV-5')
          assert not s.evidence_ok(low,'CCTV-5')
          assert not s.evidence_ok(r1080,'CCTV-4K')
          assert s.evidence_ok(r4k,'CCTV-4K')
          chosen=s.diverse_top([r720,r1080,low],'CCTV-5',4)
          eligible=[x for x in chosen if s.evidence_ok(x,'CCTV-5')]
          assert eligible == [r1080], eligible
          ev=f.quality_evidence({'height':1080,'width':1920,'codec':'h264','bitrate_mbps':3.2,'segment_ok':True,'segment_mbps':9.0,'startup_s':0.4})
          assert ev['height']==1080 and ev['segment_ok'] is True
          print('QUALITY_AWARE_CORE_SELECTOR_VALID')
          PY
      - name: Prove production untouched
        run: git diff --exit-code -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
