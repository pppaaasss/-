name: Validate Chinese-first curated lineup once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/test-curated-lineup-once.yml'

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[test-curated]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile scripts/hk_build_curated_lineup.py scripts/hk_finalize_verified_pool.py
      - name: Offline curated selection
        run: |
          rm -rf /tmp/curated-test
          mkdir -p /tmp/curated-test
          cp tv-core.m3u /tmp/curated-test/core.m3u
          cp tv.m3u /tmp/curated-test/current.m3u
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/curated-test/good.jsonl')
          rows=[]
          # Plenty of Chinese channels; leftovers should fill toward 500.
          for i in range(1,620):
              rows.append({
                  'url':f'http://127.0.0.1/cn{i}.m3u8','names':[f'地方频道{i:03d}'],'groups':['广东'],
                  'status':'GOOD','width':1920,'height':1080,'codec':'h264','bitrate_mbps':3.0,
                  'segment_ok':True,'segment_mbps':8.0,'startup_s':0.3,
              })
          for i in range(1,21):
              rows.append({
                  'url':f'http://127.0.0.1/espn{i}.m3u8','names':[f'ESPN Sports {i}'],'groups':['体育'],
                  'status':'GOOD','width':1920,'height':1080,'codec':'h264','bitrate_mbps':5.0,
                  'segment_ok':True,'segment_mbps':12.0,'startup_s':0.2,
              })
          for name in ['BBC News','BBC World News','BBC Earth','BBC Parliament','BBC Scotland']:
              rows.append({
                  'url':'http://127.0.0.1/'+name.replace(' ','_')+'.m3u8','names':[name],'groups':['国际'],
                  'status':'GOOD','width':1920,'height':1080,'codec':'h264','bitrate_mbps':4.0,
                  'segment_ok':True,'segment_mbps':10.0,'startup_s':0.2,
              })
          for i in range(1,31):
              rows.append({
                  'url':f'http://127.0.0.1/fast{i}.m3u8','names':[f'Random FAST Channel {i}'],'groups':['国际'],
                  'status':'GOOD','width':1920,'height':1080,'codec':'h264','bitrate_mbps':4.0,
                  'segment_ok':True,'segment_mbps':10.0,'startup_s':0.2,
              })
          out.write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in rows),encoding='utf-8')
          PY
          python3 scripts/hk_build_curated_lineup.py \
            --good /tmp/curated-test/good.jsonl \
            --core /tmp/curated-test/core.m3u \
            --existing-main /tmp/curated-test/current.m3u \
            --output-main /tmp/curated-test/out.m3u \
            --output-all /tmp/curated-test/out-all.m3u \
            --manifest /tmp/curated-test/manifest.json \
            --target 500 --min-count 400 --max-count 600
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/curated-test/manifest.json').read_text(encoding='utf-8'))
          assert 400 <= m['result_channels'] <= 600, m
          assert m['result_channels'] == 500, m['result_channels']
          assert m['group_counts'].get('体育',0) >= 10, m['group_counts']
          assert m['group_counts'].get('国际精选',0) >= 3, m['group_counts']
          assert m['generic_english_rejected'] >= 30, m['generic_english_rejected']
          text=Path('/tmp/curated-test/out.m3u').read_text(encoding='utf-8')
          assert 'BBC News' in text
          assert 'ESPN Sports' in text
          assert 'Random FAST Channel' not in text
          # Real repo production is not touched by the offline test.
          print('CURATED_VALID',m['result_channels'],m['group_counts'].get('体育'),m['group_counts'].get('国际精选'))
          PY
      - name: Prove production untouched
        run: git diff --exit-code -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
