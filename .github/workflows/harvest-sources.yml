name: RETIRED - legacy six-hour source harvest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-source-harvest
  cancel-in-progress: true

jobs:
  harvest:
    # Preserved only as rollback evidence. The 00:30 home-candidate workflow
    # is the sole scheduled discovery path.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record production hashes before harvest
        run: sha256sum tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u | tee /tmp/production-before.sha256

      - name: Fetch upstream text and append only never-tested URLs to pending
        run: python3 scripts/harvest_incremental.py --output-dir harvest --workers 12

      - name: Validate incremental harvest shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('harvest/incremental-manifest.json').read_text(encoding='utf-8'))
          assert manifest['stream_probe_performed'] is False
          assert manifest['production_modified'] is False
          assert manifest['raw_discovered_unique_urls'] >= 100, manifest
          assert manifest['policy']['github_never_promotes_active_routes'] is True
          assert manifest['policy']['known_rejected_urls_never_reenter_pending'] is True
          print(
              'raw',manifest['raw_discovered_unique_urls'],
              'active',manifest['active_verified_unique_urls'],
              'rejected',manifest['rejected_tombstones'],
              'pending',manifest['pending_unique_urls'],
              'new',manifest['new_unique_urls_this_run'],
          )
          PY

      - name: Prove formal production playlists unchanged
        run: |
          sha256sum tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u | tee /tmp/production-after.sha256
          diff -u /tmp/production-before.sha256 /tmp/production-after.sha256
          test -z "$(git status --porcelain -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u)"

      - name: Commit harvest directory only
        run: |
          rm -rf scripts/__pycache__
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$(git rev-parse HEAD)" || {
            echo 'master moved during harvest; refusing to overwrite newer work'
            exit 1
          }
          git add harvest/
          bad="$(git diff --cached --name-only | grep -v '^harvest/' || true)"
          test -z "$bad" || {
            echo 'Refusing non-harvest staged paths:'
            echo "$bad"
            exit 1
          }
          if git diff --cached --quiet; then
            echo 'No harvest changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+pppaaasss@users.noreply.github.com'
          git commit -m 'Refresh incremental IPTV source discovery'
          git push origin HEAD:master
