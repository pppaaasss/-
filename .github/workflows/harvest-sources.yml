name: Harvest IPTV source texts only

on:
  workflow_dispatch:
  schedule:
    # Fetch public source text four times a day. No stream probing here.
    - cron: '43 */6 * * *'

permissions:
  contents: write

concurrency:
  group: iptv-source-harvest
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record production hashes before harvest
        run: sha256sum tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u | tee /tmp/production-before.sha256

      - name: Fetch and parse upstream source text only
        run: python3 scripts/harvest_sources.py --output-dir harvest --workers 12

      - name: Validate harvest shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('harvest/manifest.json').read_text(encoding='utf-8'))
          assert manifest['stream_probe_performed'] is False
          assert manifest['production_modified'] is False
          assert manifest['candidate_entries'] >= 100, manifest['candidate_entries']
          assert manifest['unique_urls'] >= 100, manifest['unique_urls']
          print('harvest entries',manifest['candidate_entries'],'unique_urls',manifest['unique_urls'])
          PY

      - name: Prove formal production playlists unchanged
        run: |
          sha256sum tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u | tee /tmp/production-after.sha256
          diff -u /tmp/production-before.sha256 /tmp/production-after.sha256
          test -z "$(git status --porcelain -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u)"

      - name: Commit harvest directory only
        run: |
          rm -rf scripts/__pycache__
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$(git rev-parse HEAD)" || {
            echo 'master moved during harvest; refusing to overwrite newer work'
            exit 1
          }
          git add harvest/
          bad="$(git diff --cached --name-only | grep -v '^harvest/' || true)"
          test -z "$bad" || {
            echo 'Refusing non-harvest staged paths:'
            echo "$bad"
            exit 1
          }
          if git diff --cached --quiet; then
            echo 'No harvest changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+pppaaasss@users.noreply.github.com'
          git commit -m 'Refresh raw IPTV source harvest'
          git push origin HEAD:master
