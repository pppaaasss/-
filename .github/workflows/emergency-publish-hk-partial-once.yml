name: Emergency publish HK-verified CCTV routes once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/emergency-publish-hk-partial-once.yml'

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-hk-partial]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace only selected CCTV routes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repl = {
              'CCTV-4': 'http://74.91.26.218:82/live/cctv4hd.m3u8',
              'CCTV-5+': 'https://myip.pdtvhd.com/Sports/Streams/CCTV5pul.m3u8',
              'CCTV-8': 'http://74.91.26.218:82/live/cctv8hd.m3u8',
          }
          files = ['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          for fn in files:
              p=Path(fn)
              lines=p.read_text(encoding='utf-8').splitlines()
              changed=[]
              for i,line in enumerate(lines[:-1]):
                  if not line.startswith('#EXTINF:'):
                      continue
                  name=line.rsplit(',',1)[-1].strip()
                  if name in repl:
                      if name == 'CCTV-8' and 'cctv8k' in repl[name].lower():
                          raise SystemExit('refuse CCTV-8 -> cctv8k')
                      old=lines[i+1].strip()
                      lines[i+1]=repl[name]
                      changed.append((name,old,repl[name]))
              missing=set(repl)-{x[0] for x in changed}
              if missing:
                  raise SystemExit(f'{fn}: missing {sorted(missing)}')
              p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
              for name,old,new in changed:
                  print(f'{fn}: {name}\n  OLD {old}\n  NEW {new}')
          PY
      - name: Hard identity gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for fn in ['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']:
              text=Path(fn).read_text(encoding='utf-8')
              if re.search(r',CCTV-8\s*\n[^\n]*cctv8k',text,re.I):
                  raise SystemExit(f'{fn}: CCTV-8 points to cctv8k')
          print('identity gates passed')
          PY
      - name: Commit production playlists
        run: |
          git config user.name "hk-emergency-publisher"
          git config user.email "hk-emergency-publisher@users.noreply.github.com"
          git add tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Emergency switch selected CCTV routes to HK-verified alternatives"
          git push origin HEAD:master
