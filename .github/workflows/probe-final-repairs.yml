name: Probe final non-mobile repair routes
on:
  push:
    paths:
      - 'scripts/probe_final_repairs.py'
      - '.github/workflows/probe-final-repairs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Probe
        run: python3 scripts/probe_final_repairs.py
      - name: Publish report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add final-repair-probe.txt
          git diff --cached --quiet || (git commit -m 'Measure final non-mobile repair routes' && git pull --rebase -X theirs origin master && git push)
