name: Build isolated TV candidates

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/build_candidate.py'
      - '.github/workflows/build-candidate.yml'

permissions:
  contents: write

concurrency:
  group: tv-candidate-build
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HEALTH_HISTORY_CACHE: /tmp/iptv-health/health-history.json
      SOURCE_WORKERS: '10'
      PROBE_WORKERS: '16'
      PROBE_TIMEOUT: '12'
      CORE_VARIANTS_PER_CHANNEL: '20'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record production SHA256 before candidate scan
        run: |
          sha256sum tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u | tee /tmp/production-before.sha256

      - name: Restore cached route health history
        uses: actions/cache@v4
        with:
          path: /tmp/iptv-health
          key: iptv-health-${{ github.run_id }}
          restore-keys: |
            iptv-health-

      - name: Ensure ffprobe and frame dependencies
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 -m pip install --quiet pillow

      - name: Run offline hard-gate tests
        run: |
          python3 -m unittest tests.test_quality_hardening -v

      - name: Build only inside isolated candidate workspace
        id: build
        continue-on-error: true
        run: python3 scripts/build_candidate.py

      - name: Capture candidate core frames for human review
        if: ${{ !cancelled() && hashFiles('candidate/tv-easy.m3u') != '' }}
        continue-on-error: true
        run: |
          rm -rf candidate-frame-audit
          python3 scripts/audit_tv_frames.py \
            --playlist candidate/tv-easy.m3u \
            --group 卫视台 \
            --output candidate-frame-audit \
            --workers 8 \
            --timeout 30

      - name: Prove production SHA256 did not change
        if: always()
        run: |
          sha256sum tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u | tee /tmp/production-after.sha256
          diff -u /tmp/production-before.sha256 /tmp/production-after.sha256
          test -z "$(git status --porcelain -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u)"

      - name: Upload candidate report and visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-candidate-audit-${{ github.run_id }}
          path: |
            candidate/manifest.json
            candidate/build-report.txt
            candidate-frame-audit/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit candidate directory only
        if: always()
        run: |
          rm -rf scripts/__pycache__ tests/__pycache__
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$(git rev-parse HEAD)" || {
            echo 'master moved during candidate scan; refusing to overwrite newer work'
            exit 1
          }
          git add candidate/
          bad="$(git diff --cached --name-only | grep -v '^candidate/' || true)"
          test -z "$bad" || {
            echo "Refusing non-candidate staged paths:"
            echo "$bad"
            exit 1
          }
          test -z "$(git diff --cached --name-only | grep -E '^(tv-easy\.m3u|tv\.m3u|tv-all\.m3u|tv-core\.m3u)$' || true)"
          if git diff --cached --quiet; then
            echo 'No candidate changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+pppaaasss@users.noreply.github.com'
          git commit -m 'Refresh isolated TV candidates'
          git push origin HEAD:master

      - name: Propagate candidate build failure after evidence is saved
        if: ${{ steps.build.outcome == 'failure' }}
        run: exit 1
