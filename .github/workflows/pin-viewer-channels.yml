name: Pin viewer-confirmed channels

on:
  push:
    paths:
      - 'scripts/pin_viewer_channels.py'
      - '.github/workflows/pin-viewer-channels.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aptv-playlist-writes
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin viewer-confirmed CCTV-1/4/5/6 and Hunan routes
        run: python3 scripts/pin_viewer_channels.py
      - name: Publish pinned playlists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          if git diff --cached --quiet; then
            echo 'No channel pin changes'
          else
            git commit -m 'Pin viewer-confirmed living-room routes'
            git pull --rebase --autostash origin master
            git push
          fi
