name: Restore CCTV5+ previous route once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/revert-cctv5plus-once.yml'

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, '[restore-cctv5plus]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore CCTV-5+ only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          old='http://223.78.65.165:9901/tsfile/live/0006_1.m3u8?key=txiptv&playlive=1&authid=0'
          for fn in files:
              p=Path(fn); before=p.read_text(encoding='utf-8'); lines=before.splitlines(); hits=0
              for i,line in enumerate(lines[:-1]):
                  if line.startswith('#EXTINF:') and line.rsplit(',',1)[-1].strip()=='CCTV-5+':
                      lines[i+1]=old; hits+=1
              if hits!=1: raise SystemExit(f'{fn}: CCTV-5+ count={hits}')
              p.write_text('\n'.join(lines)+('\n' if before.endswith('\n') else ''),encoding='utf-8')
          PY
      - name: Verify only CCTV-5+ changed
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          expected='http://223.78.65.165:9901/tsfile/live/0006_1.m3u8?key=txiptv&playlive=1&authid=0'
          for fn in files:
              cur=Path(fn).read_text(encoding='utf-8').splitlines()
              prev=subprocess.check_output(['git','show',f'HEAD^:{fn}'],text=True).splitlines()
              def mask(lines):
                  x=list(lines); c=0
                  for i,l in enumerate(x[:-1]):
                      if l.startswith('#EXTINF:') and l.rsplit(',',1)[-1].strip()=='CCTV-5+':
                          x[i+1]='__CCTV5PLUS__'; c+=1
                  return x,c
              cm,cc=mask(cur); pm,pc=mask(prev)
              if cc!=1 or pc!=1 or cm!=pm: raise SystemExit(f'{fn}: unexpected non-CCTV5+ change')
              idx=next(i for i,l in enumerate(cur[:-1]) if l.startswith('#EXTINF:') and l.rsplit(',',1)[-1].strip()=='CCTV-5+')
              if cur[idx+1]!=expected: raise SystemExit(f'{fn}: wrong route')
          print('verified restore CCTV-5+ only')
          PY
      - name: Commit playlists
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          git diff --cached --quiet && exit 0
          git commit -m 'Restore previous CCTV-5+ route'
          git push origin HEAD:master
