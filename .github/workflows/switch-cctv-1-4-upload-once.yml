name: Switch CCTV 1 2 3 4 to uploaded routes once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-cctv-1-4-upload-once.yml'

permissions:
  contents: write

jobs:
  switch:
    if: contains(github.event.head_commit.message, '[switch-cctv-1-4-upload]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Replace only CCTV 1 2 3 4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']
          targets={
            'CCTV-1':'http://221.7.175.154:8445/tsfile/live/1000_1.m3u8?key=txiptv&playlive=1&authid=0',
            'CCTV-2':'http://113.90.154.189:9901/tsfile/live/0002_1.m3u8?key=txiptv&playlive=1&authid=0',
            'CCTV-3':'http://222.169.85.8:9901/tsfile/live/0003_1.m3u8?key=txiptv&playlive=1&authid=0',
            'CCTV-4':'http://221.7.175.154:8445/tsfile/live/1003_1.m3u8?key=txiptv&playlive=1&authid=0',
          }
          aliases={'CCTV-4 中文国际':'CCTV-4'}
          for fn in files:
              p=Path(fn); before=p.read_text(encoding='utf-8'); lines=before.splitlines(); counts={k:0 for k in targets}
              for i,line in enumerate(lines[:-1]):
                  if not line.startswith('#EXTINF:'): continue
                  name=line.rsplit(',',1)[-1].strip(); key=aliases.get(name,name)
                  if key in targets:
                      lines[i+1]=targets[key]; counts[key]+=1
              if counts != {k:1 for k in targets}: raise SystemExit(f'{fn}: bad counts {counts}')
              p.write_text('\n'.join(lines)+('\n' if before.endswith('\n') else ''),encoding='utf-8')
          PY
      - name: Verify target-only changes
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=['tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u']; names={'CCTV-1','CCTV-2','CCTV-3','CCTV-4'}
          aliases={'CCTV-4 中文国际':'CCTV-4'}
          def mask(lines):
              x=list(lines); c={n:0 for n in names}
              for i,l in enumerate(x[:-1]):
                  if l.startswith('#EXTINF:'):
                      n=l.rsplit(',',1)[-1].strip(); n=aliases.get(n,n)
                      if n in names: x[i+1]=f'__{n}__'; c[n]+=1
              return x,c
          for fn in files:
              cur=Path(fn).read_text(encoding='utf-8').splitlines(); prev=subprocess.check_output(['git','show',f'HEAD^:{fn}'],text=True).splitlines()
              cm,cc=mask(cur); pm,pc=mask(prev)
              if cm!=pm or cc!={n:1 for n in names} or pc!={n:1 for n in names}: raise SystemExit(f'{fn}: unexpected change')
          print('verified CCTV 1 2 3 4 only')
          PY
      - name: Commit playlists
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u
          git diff --cached --quiet && exit 0
          git commit -m 'Switch CCTV-1 CCTV-2 CCTV-3 CCTV-4 to uploaded routes'
          git push origin HEAD:master
