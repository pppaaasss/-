name: Build minimal AC86U sampler
on:
  pull_request:
    paths:
      - 'router/ac86u/native/**'
      - 'scripts/build_home_native.sh'
      - '.github/workflows/home-native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cross compile on GitHub
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross libcurl4-openssl-dev
          sh scripts/build_home_native.sh /tmp/native
      - uses: actions/upload-artifact@v4
        with:
          name: ac86u-native-aarch64
          path: |
            /tmp/native/iptv-native
            /tmp/native/build.json
            /tmp/native/abi.txt
          retention-days: 14
