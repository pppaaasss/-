name: Build minimal AC86U sampler
on:
  pull_request:
    paths:
      - 'router/ac86u/native/**'
      - 'scripts/build_home_native.sh'
      - '.github/workflows/home-native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 8
    steps:
      - name: Prepare build container
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git python3
      - uses: actions/checkout@v4
      - name: Cross compile on GitHub
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross libcurl4-openssl-dev qemu-user
          sh scripts/build_home_native.sh /tmp/native
      - name: Verify built ARM binary SHA-256 without router packages
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          sample = pathlib.Path('/tmp/native/sample')
          command = ['qemu-aarch64', '/usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1',
                     '--library-path', '/usr/aarch64-linux-gnu/lib',
                     '/tmp/native/iptv-native', 'sha256', str(sample)]
          for data in (b'', b'abc', b'a'*1000000, bytes(range(256))*17+b'boundary'):
              sample.write_bytes(data)
              actual = subprocess.check_output(command, timeout=20).decode().strip()
              assert actual == hashlib.sha256(data).hexdigest(), (len(data), actual)
          sample.unlink()
          print('ARM SHA-256 vectors passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ac86u-native-aarch64
          path: |
            /tmp/native/iptv-native
            /tmp/native/build.json
            /tmp/native/abi.txt
          retention-days: 14
