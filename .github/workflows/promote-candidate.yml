name: Promote reviewed TV candidate

on:
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: 'Candidate audit Actions run ID reviewed by a human'
        required: true
      confirm_visual_review:
        description: 'Type YES after reviewing the core contact-sheet artifact'
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: production-publish-lock
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirm_visual_review == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale checkout
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$(git rev-parse HEAD)"

      - name: Run offline quality gates
        run: python3 -m unittest tests.test_quality_hardening -v

      - name: Validate candidate release gates without modifying production
        run: |
          python3 scripts/candidate_release.py validate \
            --visual-confirmed \
            --audit-run-id '${{ inputs.audit_run_id }}'

      - name: Promote reviewed candidate and record rollback commit
        run: |
          python3 scripts/candidate_release.py promote \
            --visual-confirmed \
            --audit-run-id '${{ inputs.audit_run_id }}'

      - name: Reject CCTV-8 identity regression
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for path in map(Path, ('tv-easy.m3u','tv.m3u','tv-all.m3u','tv-core.m3u')):
              lines = path.read_text(encoding='utf-8', errors='ignore').splitlines()
              pending = ''
              for line in lines:
                  if line.startswith('#EXTINF'):
                      pending = line.rsplit(',',1)[-1].strip()
                  elif pending == 'CCTV-8' and line.startswith(('http://','https://')):
                      if re.search(r'cctv[-_]?8k|cctv8k|/8k(?:[/?.]|$)', line, re.I):
                          raise SystemExit(f'CCTV-8 identity conflict in {path}: {line}')
                      pending = ''
          PY

      - name: Commit only production playlists and rollback metadata
        run: |
          rm -rf scripts/__pycache__ tests/__pycache__
          allowed='^(tv-easy\.m3u|tv\.m3u|tv-all\.m3u|tv-core\.m3u|candidate/last-production\.json)$'
          bad="$(git status --porcelain | awk '{print $2}' | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "Unexpected modified paths:"; echo "$bad"; exit 1; }
          git add tv-easy.m3u tv.m3u tv-all.m3u tv-core.m3u candidate/last-production.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+pppaaasss@users.noreply.github.com'
          git commit -m 'Promote reviewed TV candidate'
          git push origin HEAD:master
