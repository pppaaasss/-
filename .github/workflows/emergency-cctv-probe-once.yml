name: Emergency CCTV alternative probe once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/emergency-cctv-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[emergency-cctv]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe alternate CCTV route families
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import hk_probe
          import hk_filter_harvest as hf

          targets=['CCTV-1','CCTV-2','CCTV-3','CCTV-4','CCTV-5','CCTV-5+','CCTV-6','CCTV-7','CCTV-8','CCTV-9','CCTV-12','CCTV-13','CCTV-17']
          formal=dict(hk_probe.load_playlist(Path('tv-core.m3u')))
          bad=hf.load_bad_urls(Path('config/home-route-feedback.json'))

          # Exact candidates already present in the older candidate core are included first.
          old=dict(hk_probe.load_playlist(Path('candidate/tv-core.m3u')))
          candidates={t:[] for t in targets}
          for t in targets:
              if old.get(t) and old[t] != formal.get(t):
                  candidates[t].append(old[t])

          nums={'CCTV-'+str(i):str(i) for i in [1,2,3,4,5,6,7,8,9,12,13,17]}
          for t,n in nums.items():
              candidates[t] += [
                  f'http://198.204.228.26/live/cctv{n}hd.m3u8',
                  f'http://204.12.221.218:8181/3m1080p/cctv{n}.m3u8',
                  f'http://207.56.13.146:81/cdnlive/cctv{n}.m3u8',
                  f'http://38.75.136.137:98/gslb/dsdqpub/cctv{n}hd.m3u8?auth=testpub',
                  f'http://63.141.230.178:82/gslb/zbdq5.m3u8?id=cctv{n}hd',
                  f'http://74.91.26.218:82/live/cctv{n}hd.m3u8',
                  f'http://107.150.60.122/live/cctv{n}hd.m3u8',
              ]
          candidates['CCTV-5'] += ['http://120.76.248.139/live/bfgd/4200000064.m3u8']
          candidates['CCTV-5+'] += [
              'http://223.78.65.165:9901/tsfile/live/0006_1.m3u8?key=txiptv&playlive=1&authid=0',
              'http://38.75.136.137:98/gslb/dsdqpub/cctv5phd.m3u8?auth=testpub',
              'http://63.141.230.178:82/gslb/zbdq5.m3u8?id=cctv5phd',
              'http://198.204.228.26/live/cctv5phd.m3u8',
          ]

          jobs=[]; seen=set()
          for t,urls in candidates.items():
              for u in urls:
                  if u in bad or u==formal.get(t): continue
                  if t=='CCTV-8' and 'cctv8k' in u.lower(): continue
                  k=(t,u)
                  if k in seen: continue
                  seen.add(k); jobs.append(k)

          def one(job):
              t,u=job
              r=hk_probe.probe_one((t,u))
              d=r.__dict__.copy()
              d['target']=t; d['url']=u
              br=float(d.get('bitrate_mbps') or 0)
              codec=str(d.get('codec') or '').lower()
              d['eligible']=bool(d.get('status')=='GOOD' and int(d.get('height') or 0)>=1080 and d.get('segment_ok') and not (codec=='h264' and 0<br<2.0))
              return d

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              results=list(ex.map(one,jobs))
          good={t:[] for t in targets}
          for r in results:
              if r['eligible']:
                  good[r['target']].append(r)
          for t in targets:
              good[t].sort(key=lambda r:(int(r.get('height') or 0), float(r.get('bitrate_mbps') or 0), float(r.get('segment_mbps') or 0), -float(r.get('startup_s') or 0)), reverse=True)
              print('TARGET',t,'CURRENT',formal.get(t,''))
              for r in good[t][:5]:
                  print('GOOD',t,f"{r.get('width',0)}x{r.get('height',0)}",r.get('codec',''),f"bitrate={float(r.get('bitrate_mbps') or 0):.3f}",f"dl={float(r.get('segment_mbps') or 0):.3f}",f"startup={float(r.get('startup_s') or 0):.3f}",r['url'])
              if not good[t]: print('NONE',t)
          Path('/tmp/emergency.json').write_text(json.dumps(good,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
