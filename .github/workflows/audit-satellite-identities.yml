name: Audit satellite channel identities

on:
  push:
    paths:
      - '.github/workflows/audit-satellite-identities.yml'
      - 'scripts/audit_tv_frames.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satellite-identity-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install frame audit dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 -m pip install --quiet pillow
      - name: Capture every 卫视台 frame
        run: python3 scripts/audit_tv_frames.py --playlist tv.m3u --group 卫视台 --output frame-audit --workers 10 --timeout 22 || true
      - name: Upload contact sheets and results
        uses: actions/upload-artifact@v4
        with:
          name: satellite-identity-audit
          path: frame-audit/
          retention-days: 3
